name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (PHP tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Run test suite
        run: composer test

  frontend-checks:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # No bloqueante: el proyecto tiene ~60 errores de lint preexistentes
      # (no-unused-vars, set-state-in-effect, etc.) acumulados antes de este
      # CI, ajenos a cualquier cambio puntual. Se deja visible en el log de
      # cada corrida para que no crezca en silencio, pero no bloquea el
      # merge hasta que se aborde esa deuda como su propia tarea aparte.
      - name: Lint (informativo, no bloqueante)
        run: npm run lint || true

      - name: Build
        run: npm run build
